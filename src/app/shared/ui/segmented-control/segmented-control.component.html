<div
  role="group"
  [attr.aria-label]="ariaLabel"
  class="inline-flex w-full rounded-xl border border-outline-variant bg-surface-container-low p-1">
  @for (option of options; track option.value) {
  <button
    type="button"
    (click)="select(option.value)"
    class="flex-1 rounded-lg px-3 py-2 text-sm font-semibold transition-colors"
    [class.bg-surface-container-lowest]="value === option.value"
    [class.text-primary]="value === option.value"
    [class.shadow-sm]="value === option.value"
    [class.text-on-surface-variant]="value !== option.value"
    [class.hover:text-on-surface]="value !== option.value"
    [attr.aria-pressed]="value === option.value">
    {{ option.label }}
  </button>
  }
</div>
