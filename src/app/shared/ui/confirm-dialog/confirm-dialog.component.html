@if (visible) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-black/50" (click)="onBackdropClick()"></div>

    <div class="relative w-full max-w-md rounded-lg bg-white p-6 shadow-xl">
      <h2 class="text-lg font-semibold text-gray-900">{{ header }}</h2>
      <p class="mt-2 text-sm text-gray-600">{{ message }}</p>

      <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <button
          type="button"
          (click)="onReject()"
          class="w-full px-4 py-2 text-sm font-medium text-gray-700 rounded-lg hover:bg-gray-100 transition-colors sm:w-auto">
          {{ rejectLabel }}
        </button>
        <button
          type="button"
          (click)="onAccept()"
          [class]="acceptButtonClasses">
          {{ acceptLabel }}
        </button>
      </div>
    </div>
  </div>
}
