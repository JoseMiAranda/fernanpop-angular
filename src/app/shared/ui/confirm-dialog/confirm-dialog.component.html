@if (visible) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-black/50" (click)="onBackdropClick()"></div>

    <div class="relative w-full max-w-md">
      <app-card variant="elevated" padding="lg">
        <h2 class="font-headline text-lg font-semibold text-on-surface">{{ header }}</h2>
        <p class="mt-2 text-sm text-on-surface-variant">{{ message }}</p>

        <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
          <app-button variant="secondary" [label]="rejectLabel" (action)="onReject()" />
          <app-button
            [variant]="acceptButtonVariant"
            [destructiveStyle]="acceptDestructiveStyle"
            [label]="acceptLabel"
            (action)="onAccept()" />
        </div>
      </app-card>
    </div>
  </div>
}
