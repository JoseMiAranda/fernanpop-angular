@if (visible) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-black/50" (click)="onBackdropClick()"></div>

    <div class="relative w-full max-w-md">
      <app-card variant="elevated" padding="lg">
      <h2 class="font-headline text-lg font-semibold text-on-surface">¿Cómo fue el producto?</h2>
      @if (productTitle) {
      <p class="mt-1 text-sm text-on-surface-variant">{{ productTitle | titlecase }}</p>
      }
      <p class="mt-2 text-sm text-on-surface-variant">Valora tu experiencia con una puntuación del 1 al 5.</p>

      <div class="mt-5 flex flex-wrap justify-center gap-1.5 sm:gap-2">
        @for (score of scores; track score) {
        <button
          type="button"
          (click)="selectScore(score)"
          class="flex size-10 items-center justify-center rounded-lg border text-sm font-semibold transition-colors sm:size-11"
          [class.border-primary]="selectedScore() === score"
          [class.bg-primary]="selectedScore() === score"
          [class.text-white]="selectedScore() === score"
          [class.border-outline-variant]="selectedScore() !== score"
          [class.bg-surface-container]="selectedScore() !== score"
          [class.text-on-surface]="selectedScore() !== score"
          [class.hover:border-primary]="selectedScore() !== score"
          [attr.aria-label]="'Puntuación ' + score">
          {{ score }}
        </button>
        }
      </div>

      <div class="mt-5">
        <label for="review-description" class="mb-2 block text-sm font-medium text-on-surface">
          Descripción <span class="text-on-surface-variant">(opcional)</span>
        </label>
        <textarea
          id="review-description"
          rows="3"
          maxlength="500"
          [ngModel]="description()"
          (ngModelChange)="description.set($event)"
          placeholder="Cuéntanos tu experiencia con el producto..."
          class="w-full resize-none rounded-lg border border-outline-variant bg-surface-container-lowest px-3 py-2 text-sm text-on-surface placeholder:text-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary">
        </textarea>
      </div>

      <div class="mt-6 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
        <app-button variant="tertiary" (action)="onSkip()">Omitir</app-button>
        <app-button [disabled]="selectedScore() === null" (action)="onSubmit()">
          Enviar valoración
        </app-button>
      </div>
      </app-card>
    </div>
  </div>
}
