@if (toasts().length > 0) {
<div
  class="pointer-events-none fixed bottom-4 right-4 z-[60] flex w-[min(100vw-2rem,22rem)] flex-col-reverse gap-3"
  aria-live="polite"
  aria-label="Notificaciones de mensajes">
  @for (toast of toasts(); track toast.id) {
  <button
    type="button"
    class="pointer-events-auto flex w-full items-start gap-3 rounded-2xl border border-outline-variant/40 bg-surface-container-lowest p-4 text-left shadow-lg ring-1 ring-black/5 transition hover:bg-surface-container-high"
    (click)="openConversation(toast)">
    <div class="size-12 shrink-0 overflow-hidden rounded-xl bg-surface-container">
      @if (toast.productImage) {
      <img [src]="toast.productImage" [alt]="toast.productTitle" class="size-full object-cover" />
      } @else {
      <div class="flex size-full items-center justify-center text-xs font-semibold text-on-surface-variant">
        FP
      </div>
      }
    </div>

    <div class="min-w-0 flex-1">
      <p class="text-xs font-semibold uppercase tracking-wide text-primary">Nuevo mensaje</p>
      <p class="mt-1 truncate font-headline text-sm font-semibold text-on-surface">{{ toast.productTitle }}</p>
      <p class="mt-1 line-clamp-2 break-words text-sm leading-5 text-on-surface-variant">{{ toast.preview }}</p>
    </div>

    <button
      type="button"
      class="shrink-0 rounded-full p-1 text-on-surface-variant transition hover:bg-surface-container-high hover:text-on-surface"
      aria-label="Cerrar notificación"
      (click)="dismiss(toast.id, $event)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="size-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </button>
  }
</div>
}
