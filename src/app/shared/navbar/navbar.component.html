<div class="sticky top-0 z-40 bg-surface">
    <div class="w-full bg-surface-container-lowest text-on-surface shadow-sm">
        <div class="mx-auto flex max-w-container-max flex-col px-margin-mobile pb-3 sm:pb-4 md:px-margin-tablet lg:px-margin-desktop">
            <div class="flex w-full min-w-0 flex-row items-center justify-between gap-2 py-2 sm:gap-3 sm:py-4">
                <app-title class="shrink-0"></app-title>

                <app-searcher *ngIf="!apperarBottomSearcher()" class="hidden min-w-0 md:flex md:flex-1 md:px-6 lg:px-10"></app-searcher>

                <div class="flex shrink-0 items-center justify-center gap-2 sm:gap-3">
                    @if (currentUser()) {
                    <app-dropdown-menu
                        [items]="items()"
                        [photoUrl]="currentUser()?.photoUrl"
                        [displayName]="userDisplayName()"
                        ariaLabel="Abrir menú de usuario" />
                    } @else {
                    <app-button
                        variant="secondary"
                        label="Iniciar sesión"
                        [routerLink]="['/login']" />
                    <app-button
                        label="Registrarse"
                        [routerLink]="['/register']" />
                    }
                </div>
            </div>
            <app-searcher *ngIf="apperarBottomSearcher()" class="min-w-0 px-2 pb-2 sm:px-4 md:hidden"></app-searcher>
        </div>
    </div>
</div>
