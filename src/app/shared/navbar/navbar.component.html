<div class="bg-surface">
    <div class="w-full bg-surface-container-lowest text-on-surface">
        <div class="mx-auto flex max-w-container-max flex-col px-margin-mobile pb-3 sm:pb-4 md:flex-row md:items-center md:justify-between">
            <div class="flex w-full min-w-0 flex-row items-center justify-between gap-2 p-2 sm:gap-3 sm:p-4">
                <app-title class="shrink-0"></app-title>
                <app-searcher *ngIf="!apperarBottomSearcher()" class="hidden min-w-0 md:flex md:flex-1 md:px-6 lg:px-10"></app-searcher>
                <div class="flex shrink-0 items-center justify-center gap-2 sm:gap-3">
                    <app-dropdown-menu
                        [items]="items()"
                        [photoUrl]="currentUser()?.photoUrl"
                        [displayName]="userDisplayName()"
                        [ariaLabel]="currentUser() ? 'Abrir menú de usuario' : 'Abrir menú'" />
                </div>
            </div>
            <app-searcher *ngIf="apperarBottomSearcher()" class="min-w-0 px-2 pb-2 sm:px-4 md:hidden"></app-searcher>
        </div>
    </div>
</div>
