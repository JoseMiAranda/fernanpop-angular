<form
    class="flex w-full items-center gap-1 rounded-full border border-outline-variant bg-surface-container-lowest px-2 shadow-sm transition-[border-color,box-shadow] focus-within:border-primary focus-within:ring-1 focus-within:ring-primary sm:gap-1.5 sm:px-3"
    (submit)="onSubmit($event)">
    <button
        type="submit"
        class="shrink-0 rounded-full p-1.5 text-on-surface-variant transition-colors hover:text-primary sm:p-2"
        aria-label="Buscar">
        <svg class="size-5 sm:size-6" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
                d="M14.9536 14.9458L21 21M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </button>

    <div class="relative min-w-0 flex-1">
        <input
            #searchInput
            type="search"
            id="search"
            autocomplete="off"
            class="relative z-10 w-full truncate rounded-full bg-transparent py-2 pl-0.5 pr-1 text-sm text-on-surface outline-none sm:py-2.5 sm:text-base"
            (input)="onInput(searchInput.value)"
            (focus)="onFocus()"
            (blur)="onBlur()" />

        @if (showPlaceholder()) {
        <div
            class="pointer-events-none absolute inset-y-0 left-0.5 right-0 flex items-center truncate pr-1"
            aria-hidden="true">
            <span class="truncate text-sm text-on-surface-variant sm:text-base">
                Buscar productos, marcas o categorías
                <span class="hidden sm:inline"> — p. ej.</span>
                <span
                    class="ml-1 font-medium text-on-surface-variant/90 transition-opacity duration-500"
                    [class.opacity-0]="!suggestionVisible()">
                    «{{ suggestion() }}»
                </span>
            </span>
        </div>
        }
    </div>

    @if (hasText()) {
    <button
        type="button"
        class="shrink-0 rounded-full p-1.5 text-on-surface-variant transition-colors hover:bg-surface-container hover:text-on-surface sm:p-2"
        aria-label="Limpiar búsqueda"
        (click)="clear()">
        <svg class="size-4 sm:size-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
                d="M18 6L6 18M6 6l12 12"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round" />
        </svg>
    </button>
    }
</form>
