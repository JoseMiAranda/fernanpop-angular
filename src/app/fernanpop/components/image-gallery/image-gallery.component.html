<div class="mx-auto flex w-full max-w-[640px] flex-col gap-3">
    @if (images.length) {
    <div class="relative aspect-[4/3] w-full overflow-hidden rounded-lg bg-gray-100 dark:bg-gray-700">
        <img [src]="images[selectedIndex()]" class="h-full w-full object-contain" alt="Imagen del producto" />

        @if (images.length > 1) {
        <button type="button" (click)="previous()"
            class="absolute left-2 top-1/2 flex size-9 -translate-y-1/2 items-center justify-center rounded-full bg-black/40 text-white transition-colors hover:bg-black/60"
            aria-label="Imagen anterior">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" />
            </svg>
        </button>
        <button type="button" (click)="next()"
            class="absolute right-2 top-1/2 flex size-9 -translate-y-1/2 items-center justify-center rounded-full bg-black/40 text-white transition-colors hover:bg-black/60"
            aria-label="Imagen siguiente">
            <svg xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" />
            </svg>
        </button>
        }
    </div>

    @if (images.length > 1) {
    <div class="flex gap-2 overflow-x-auto pb-1">
        @for (image of images; track $index) {
        <button type="button" (click)="selectImage($index)"
            class="shrink-0 overflow-hidden rounded border-2 transition-colors"
            [class.border-blue-500]="$index === selectedIndex()"
            [class.border-transparent]="$index !== selectedIndex()">
            <img [src]="image" class="h-12 w-20 object-cover md:h-20 md:w-32" alt="" />
        </button>
        }
    </div>
    }
    }
</div>
