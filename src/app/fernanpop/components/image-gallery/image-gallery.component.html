<div class="flex flex-col gap-gutter">
    @if (images.length) {
    <div class="relative flex aspect-[4/3] items-center justify-center overflow-hidden rounded-3xl bg-gallery-bg">
        <img [src]="images[selectedIndex()]" class="h-4/5 w-4/5 object-contain drop-shadow-2xl transition-transform duration-700"
            alt="Imagen del producto" />
    </div>

    @if (images.length > 1) {
    <div class="grid grid-cols-5 gap-4">
        @for (image of images; track $index) {
        <button type="button" (click)="selectImage($index)"
            class="aspect-square cursor-pointer rounded-xl bg-white p-2 transition-all hover:border-primary-container hover:shadow-md"
            [class.border-2]="$index === selectedIndex()"
            [class.border-primary-container]="$index === selectedIndex()"
            [class.border]="$index !== selectedIndex()"
            [class.border-outline-variant]="$index !== selectedIndex()">
            <img [src]="image" class="h-full w-full object-contain" alt="" />
        </button>
        }
    </div>
    }
    }
</div>
