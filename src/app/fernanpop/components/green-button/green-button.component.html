<button
    (click)="onClick()"
    [disabled]="isDisabled"
    [attr.type]="submit ? 'submit' : 'button'"
    [class.bg-primary-container]="!isDisabled"
    [class.hover:bg-primary]="!isDisabled"
    [class.bg-gray-400]="isDisabled"
    [class.cursor-not-allowed]="isDisabled"
    [class.w-full]="fullWidth"
    class="inline-flex items-center justify-center rounded-lg px-8 py-4 text-sm font-bold text-white shadow-sm transition-all active:scale-95">
    {{ title }}
</button>
