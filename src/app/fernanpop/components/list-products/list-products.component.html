<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 p-8">
    @for (product of listProducts; track product.id) {
    <div class="flex flex-col gap-3 rounded-lg bg-slate-800 p-4">
        <a [routerLink]="['/fernanpop/product', product.id]" class="block">
            <div class="relative aspect-[3/2] w-full overflow-hidden rounded-md">
                @if (isReserved(product)) {
                <div
                    class="absolute top-2 right-2 z-10 flex items-center gap-1 rounded bg-emerald-500 px-2 py-1 text-white">
                    <svg xmlns="http://www.w3.org/2000/svg" class="size-4 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M5 21V5q0-.825.588-1.412T7 3h10q.825 0 1.413.588T19 5v16l-7-3zm2-3.05l5-2.15l5 2.15V5H7zM7 5h10z" />
                    </svg>
                    <span class="text-xs font-medium">Reservado</span>
                </div>
                }
                <img class="h-full w-full object-cover" [src]="product.images[0]" [alt]="product.title" />
            </div>
        </a>

        <div class="flex flex-col gap-1">
            <a [routerLink]="['/fernanpop/product', product.id]">
                <h3 class="truncate text-sm font-bold text-white">
                    {{ product.title | titlecase }}
                </h3>
            </a>

            <div class="flex items-center justify-between gap-2">
                <span class="text-sm text-slate-300">
                    {{ product.price | monetary }}
                </span>
                @if (user() && user()!.uid == product.sellerId && !isReserved(product)) {
                <a [routerLink]="['/fernanpop/update-product', product.id]"
                    class="shrink-0 rounded-md bg-teal-700 px-2 py-1 text-xs font-medium text-white transition-colors hover:bg-teal-600">
                    Modificar
                </a>
                }
            </div>
        </div>
    </div>
    }
</div>
