<main class="bg-surface text-on-surface">
  <app-hero-section
    [heroImage]="heroImage"
    [categories]="categories()"
    (browseMarketplace)="browseMarketplace()"
    (browseCategory)="browseCategory($event)" />

  <app-featured-section
    [productsState]="productsState()"
    [featuredProducts]="featuredProducts()"
    (browseMarketplace)="browseMarketplace()" />
</main>

<button type="button" (click)="scrollToTop()"
  class="fixed bottom-8 right-8 z-40 flex size-12 items-center justify-center rounded-full border border-outline-variant bg-white/80 shadow-lg backdrop-blur-md transition-all hover:bg-primary hover:text-white"
  [class.opacity-0]="!showBackToTop()" [class.pointer-events-none]="!showBackToTop()">
  <svg xmlns="http://www.w3.org/2000/svg" class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75 12 8.25m0 0 7.5 7.5M12 8.25v13.5" />
  </svg>
</button>
