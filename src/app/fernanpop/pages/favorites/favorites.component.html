@if (favoritesState().type === 'loading') {
<app-page-container>
    <app-text>Cargando favoritos...</app-text>
</app-page-container>
}

@if (favoritesState().type === 'success') {
<app-page-container>
    <app-page-title size="compact">Mis favoritos</app-page-title>

    @if (displayedProducts().length > 0) {
    <app-list-products [listProducts]="displayedProducts()"></app-list-products>
    } @else {
    <app-empty-state
        title="Sin favoritos"
        description="No tienes favoritos aún. Explora el marketplace y guarda los productos que te interesen." />
    }
</app-page-container>
}

@if (favoritesState().type === 'error') {
<app-page-container>
    <app-text>Error: {{ favoritesState().error }}</app-text>
</app-page-container>
}
