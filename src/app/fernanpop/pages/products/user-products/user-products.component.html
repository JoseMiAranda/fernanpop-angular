@if (productState().type === 'loading') {
<app-page-container>
    <app-text>Cargando productos...</app-text>
</app-page-container>
}

@if (productState().type === 'success') {
<app-page-container>
    <div class="mb-stack-lg flex flex-col gap-stack-md sm:flex-row sm:items-center sm:justify-between">
        <app-page-title size="compact" [withMargin]="false">Mis productos</app-page-title>
        <app-button label="Agregar producto" [routerLink]="['/create-product']" />
    </div>

    @if (productState().data.length > 0) {
    <app-list-products [listProducts]="productState().data"></app-list-products>
    } @else {
    <app-empty-state
        title="Sin productos"
        description="No hay productos disponibles. Publica tu primer anuncio para empezar a vender." />
    }
</app-page-container>
}

@if (productState().type === 'error') {
<app-page-container>
    <app-text>Error: {{ productState().error }}</app-text>
</app-page-container>
}
